name: MemePuzzle
options:
  bundleIdPrefix: com.novalabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  MemePuzzleCore:
    path: MemePuzzleCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0
targets:
  MemePuzzle:
    type: application
    platform: iOS
    sources:
      - path: MemePuzzle
    dependencies:
      - package: MemePuzzleCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: MemePuzzle/Info.plist
      properties:
        CFBundleDisplayName: Meme Blitz
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        GADApplicationIdentifier: ca-app-pub-6761529298065224~9369004306
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novalabs.memeblitz
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_ENTITLEMENTS: MemePuzzle/MemePuzzle.entitlements
  MemePuzzleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MemePuzzleUITests
    dependencies:
      - target: MemePuzzle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novalabs.memeblitz.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MemePuzzle:
    build:
      targets:
        MemePuzzle: all
    test:
      targets:
        - package: MemePuzzleCore/MemePuzzleCoreTests
        - MemePuzzleUITests
