name: MemeBlitz
options:
  bundleIdPrefix: com.novalabs
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  MemeBlitzCore:
    path: MemeBlitzCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0
targets:
  MemeBlitz:
    type: application
    platform: iOS
    sources:
      - path: MemePuzzle
    dependencies:
      - package: MemeBlitzCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: MemePuzzle/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novalabs.memeblitz
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        CODE_SIGN_ENTITLEMENTS: MemePuzzle/MemePuzzle.entitlements
  MemePuzzleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MemePuzzleUITests
    dependencies:
      - target: MemeBlitz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.novalabs.memeblitz.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MemeBlitz:
    build:
      targets:
        MemeBlitz: all
    test:
      targets:
        - package: MemeBlitzCore/MemeBlitzCoreTests
        - MemePuzzleUITests
